spring:
  application:
    name: interviewstack

  datasource:
    url: jdbc:postgresql://localhost:5432/interviewstack
    username: interviewstack
    password: interviewstack

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        # 로컬에 GEMINI_API_KEY가 없어도 앱은 정상 기동되도록 기본값은 빈 문자열로 둔다.
        # 채점(Chat)은 2026-10-01부터 Groq로 옮겨서 더 이상 이 키를 안 쓰고, 여기 api-key는
        # ReferenceDocumentEmbeddingRunner가 "키가 설정됐는지" 판단할 때만 참조한다
        # (임베딩 모델 자체는 바로 아래 embedding.api-key를 따로 읽음. 둘 다 같은 GEMINI_API_KEY).
        # 없으면 ReferenceSearchService가 빈 참고자료 목록으로 안전하게 처리한다.
        api-key: ${GEMINI_API_KEY:}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    openai:
      # Groq: 카드 등록 없이 가입 가능한 무료 LLM 추론 서비스. OpenAI 호환 엔드포인트를 제공해서
      # Spring AI의 OpenAI 모듈을 그대로 쓰되 base-url만 Groq로 바꿔서 연결한다.
      # GROQ_API_KEY가 없으면 앱은 정상 기동되지만 답변 제출 시 채점이 실패해 502가 반환된다.
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}

server:
  port: 8080

interviewstack:
  ai:
    # Gemini API 결제/쿼터 문제 등으로 실제 LLM 호출 없이 앱 흐름(질문 제출→첨삭 화면 전환→대시보드 반영)만
    # 테스트하고 싶을 때 true로. true면 GradingService/ReferenceSearchService/ReferenceDocumentEmbeddingRunner가
    # 실제 Gemini 호출을 건너뛰고 미리 정해둔 가짜 결과를 돌려준다 (비용 발생 없음, 실제 채점 품질은 검증 불가).
    mock-mode: ${AI_MOCK_MODE:false}
  jwt:
    # 로컬 개발용 기본값. 운영 배포 시 반드시 환경변수(JWT_SECRET)로 덮어쓸 것.
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24시간
  grading:
    # 첨삭 루브릭 v1: 40점 만점의 70%(28점) 미만이면 오답노트(취약) 대상으로 분류
    weak-threshold: 28
  rag:
    top-k: 3
    # pgvector 코사인 거리(<=>) 기준. similarityThreshold 0.6 == distance 0.4 이하
    max-distance: 0.4

logging:
  level:
    com.interviewstack: DEBUG
