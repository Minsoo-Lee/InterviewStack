spring:
  application:
    name: interviewstack

  datasource:
    # DB_HOST/DB_PORT는 docker-compose에서 백엔드 컨테이너가 postgres 컨테이너를 찾을 때만
    # 오버라이드한다(DB_HOST=postgres). 로컬(비도커) 실행 시엔 기본값(localhost)을 그대로 쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/interviewstack
    username: interviewstack
    password: interviewstack

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    # 임베딩(RAG 근거자료 검색)은 2026-10-01부터 외부 API(Gemini) 대신 로컬 ONNX 모델로 계산한다.
    # 외부 호출이 전혀 없어서 가입/카드/쿼터/결제 문제가 원천적으로 없다 — 애플리케이션 안에서 직접
    # 계산(all-MiniLM-L6-v2, 384차원). 첫 실행 시 모델(~80MB)을 Hugging Face에서 내려받아
    # ${java.io.tmpdir}/spring-ai-onnx-model에 캐싱하므로, 최초 1회는 기동이 느리고 인터넷 연결이 필요하다.
    # 주의: 이 모델은 영어 위주로 학습돼 있어 한국어 질문/답변 간 유사도 품질은 제한적일 수 있다
    # (틀린 건 아니고, 더 정확한 한국어 임베딩이 필요해지면 다국어 ONNX 모델로 교체 고려).
    model:
      embedding: transformers
    openai:
      # Groq: 카드 등록 없이 가입 가능한 무료 LLM 추론 서비스. OpenAI 호환 엔드포인트를 제공해서
      # Spring AI의 OpenAI 모듈을 그대로 쓰되 base-url만 Groq로 바꿔서 연결한다.
      # GROQ_API_KEY가 없으면 앱은 정상 기동되지만 답변 제출 시 채점이 실패해 502가 반환된다.
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}

server:
  port: 8080

interviewstack:
  ai:
    # Gemini API 결제/쿼터 문제 등으로 실제 LLM 호출 없이 앱 흐름(질문 제출→첨삭 화면 전환→대시보드 반영)만
    # 테스트하고 싶을 때 true로. true면 GradingService/ReferenceSearchService/ReferenceDocumentEmbeddingRunner가
    # 실제 Gemini 호출을 건너뛰고 미리 정해둔 가짜 결과를 돌려준다 (비용 발생 없음, 실제 채점 품질은 검증 불가).
    mock-mode: ${AI_MOCK_MODE:false}
  jwt:
    # 로컬 개발용 기본값. 운영 배포 시 반드시 환경변수(JWT_SECRET)로 덮어쓸 것.
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24시간
  grading:
    # 첨삭 루브릭 v1: 40점 만점의 70%(28점) 미만이면 오답노트(취약) 대상으로 분류
    weak-threshold: 28
  rag:
    top-k: 3
    # pgvector 코사인 거리(<=>) 기준. similarityThreshold 0.6 == distance 0.4 이하
    max-distance: 0.4

logging:
  level:
    com.interviewstack: DEBUG
