spring:
  application:
    name: interviewstack

  datasource:
    url: jdbc:postgresql://localhost:5432/interviewstack
    username: interviewstack
    password: interviewstack

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        # 로컬에 GEMINI_API_KEY가 없어도 앱은 정상 기동되도록 기본값은 빈 문자열로 둔다.
        # 실제 채점/임베딩 호출 시점에만 키가 필요하며, 없으면 GradingService/ReferenceSearchService가
        # 각각 502 응답 또는 빈 참고자료 목록으로 안전하게 처리한다.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

server:
  port: 8080

interviewstack:
  jwt:
    # 로컬 개발용 기본값. 운영 배포 시 반드시 환경변수(JWT_SECRET)로 덮어쓸 것.
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24시간
  grading:
    # 첨삭 루브릭 v1: 40점 만점의 70%(28점) 미만이면 오답노트(취약) 대상으로 분류
    weak-threshold: 28
  rag:
    top-k: 3
    # pgvector 코사인 거리(<=>) 기준. similarityThreshold 0.6 == distance 0.4 이하
    max-distance: 0.4

logging:
  level:
    com.interviewstack: DEBUG
