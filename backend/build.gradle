plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.interviewstack'
version = '0.0.1-SNAPSHOT'
description = 'InterviewStack backend API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    // Boot 4.0.0이 관리하는 기본 Flyway 버전이 최신 PostgreSQL 16.x 패치 버전을 몰라서
    // "Unsupported Database: PostgreSQL 16.14" 에러가 났음 — 최신 버전으로 직접 고정.
    set('flyway.version', '13.7.0')
}

dependencies {
    // Spring AI - AIAgent/RagPipeline 참고 프로젝트와 동일 라인(2.0.0)으로 고정.
    // Spring AI 2.0.x가 Boot 4.0/4.1만 지원해서 Boot를 3.3.5→4.0.0으로 올렸음 (2026-09-18 결정).
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring AI - Google GenAI (Gemini) Chat / Embedding
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'

    // DB / 마이그레이션
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Boot 4부터는 flyway-database-postgresql을 명시적으로 추가해야 PostgreSQL을 인식함
    // (spring-boot-starter-flyway만으로는 부족 — 없으면 "Unsupported Database" 에러 발생)
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 로컬 개발 편의용: backend/.env를 자동으로 읽어서 환경변수로 주입해줌
    // (개발 전용이라 developmentOnly로 선언 — 운영 빌드(bootJar)에는 포함 안 됨)
    implementation platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
    developmentOnly 'me.paulschwarz:springboot4-dotenv'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
