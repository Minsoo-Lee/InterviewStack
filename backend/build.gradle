plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.interviewstack'
version = '0.0.1-SNAPSHOT'
description = 'InterviewStack backend API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    // Boot 4.0.0이 관리하는 기본 Flyway 버전이 최신 PostgreSQL 16.x 패치 버전을 몰라서
    // "Unsupported Database: PostgreSQL 16.14" 에러가 났음 — 최신 버전으로 직접 고정.
    set('flyway.version', '13.7.0')
}

dependencies {
    // Spring AI - AIAgent/RagPipeline 참고 프로젝트와 동일 라인(2.0.0)으로 고정.
    // Spring AI 2.0.x가 Boot 4.0/4.1만 지원해서 Boot를 3.3.5→4.0.0으로 올렸음 (2026-09-18 결정).
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring AI - 채점(Chat)은 Groq(무료, OpenAI 호환 엔드포인트)로, 임베딩(RAG)은 로컬 ONNX 모델로 분리.
    // 둘 다 2026-10-01에 Gemini 결제/쿼터(402) 문제를 피하려고 옮김 - 임베딩은 외부 API 호출 자체가
    // 없어서 가입/카드/쿼터/결제 문제가 원천적으로 발생하지 않음.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-transformers'

    // DB / 마이그레이션
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Boot 4부터는 flyway-database-postgresql을 명시적으로 추가해야 PostgreSQL을 인식함
    // (spring-boot-starter-flyway만으로는 부족 — 없으면 "Unsupported Database" 에러 발생)
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 로컬 개발 편의용: backend/.env를 자동으로 읽어서 환경변수로 주입해줌
    // (개발 전용이라 developmentOnly로 선언 — 운영 빌드(bootJar)에는 포함 안 됨)
    implementation platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
    developmentOnly 'me.paulschwarz:springboot4-dotenv'

    // 도커 핫 리로드용: docker-compose의 backend 컨테이너가 `gradlew bootRun --continuous`로
    // 뜨는데, --continuous는 소스 변경 감지 시 재컴파일만 해줄 뿐이라 DevTools 없이도 재시작은 되지만,
    // DevTools를 추가하면 더 빠르고 매끄러운 재시작(클래스로더 재사용)을 해준다. developmentOnly라
    // 운영 빌드에는 포함 안 됨.
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
